
fundamentals:
  name: hvfhv_trip_events
  domain: ride-hailing / high-volume for-hire vehicle trips
  description: >
    Consumer-defined contract for January 2024 NYC High-Volume For-Hire
    Vehicle trip records. The contract evaluates source conformance and
    data quality for trip-duration analysis and prediction.
  version: 1.1.0
  status: active
  source_dataset: fhvhv_tripdata_2024-01.parquet
  sample_size: 20000
  sample_method: >
    Reproducible reservoir sample stratified by pickup day across all
    31 days of January 2024, using random seed 42. Source values are
    retained without quality-based filtering before validation.

stakeholders:
  producer:
    name: NYC Taxi & Limousine Commission
    description: >
      Public publisher of monthly HVFHV trip records submitted by
      licensed high-volume for-hire vehicle bases.

  consumer:
    name: Decision-Support / Trip-Duration Analysis
    description: >
      Uses trip records for trip-duration prediction and related
      analysis of trip timing, distance, and location.

  contract_owner:
    name: Data Analyst
    description: >
      Maintains consumer requirements, source mappings, validation
      rules, and documented exceptions.

schema:
  fields:
    - name: hvfhs_license_num
      type: string
      description: HVFHV license identifier
      required: true

    - name: request_datetime
      type: timestamp
      description: Recorded time the rider requested the trip
      required: true

    - name: on_scene_datetime
      type: timestamp
      description: Recorded driver arrival time at pickup location
      required: false
      notes: >
        Missing values must not automatically be classified as defects;
        interpret according to the source definition and applicable trip type.

    - name: pickup_datetime
      type: timestamp
      description: Recorded trip pickup time
      required: true

    - name: dropoff_datetime
      type: timestamp
      description: Recorded trip drop-off time
      required: true

    - name: PULocationID
      type: integer
      description: Pickup location identifier
      required: true

    - name: DOLocationID
      type: integer
      description: Drop-off location identifier
      required: true

    - name: trip_miles
      type: float
      description: Reported trip distance in miles
      required: true

    - name: trip_time
      type: integer
      description: Reported trip duration in seconds
      required: true

    - name: base_passenger_fare
      type: float
      description: Reported base passenger fare
      required: true

source_mappings:
  canonical_concepts:
    trip_duration:
      source_field: trip_time
      unit: seconds
      validation_reference: >
        Compare reported duration with the elapsed time between pickup
        and drop-off timestamps.

    trip_distance:
      source_field: trip_miles
      unit: miles

    pickup_location:
      source_field: PULocationID
      mapping: TLC taxi-zone lookup

    dropoff_location:
      source_field: DOLocationID
      mapping: TLC taxi-zone lookup

service_level_objectives:
  - name: completeness_dropoff_zone
    description: >
      Proportion of records whose drop-off location identifier is
      recognised by the applicable TLC location lookup.
    metric: >
      Records with a recognised DOLocationID divided by all sampled records.
    threshold: ">= 95%"
    exception_handling: >
      Handle documented special location codes explicitly. Do not classify
      a code as invalid solely because it is excluded from a subset of zones.

  - name: completeness_pickup_zone
    description: >
      Proportion of records whose pickup location identifier is
      recognised by the applicable TLC location lookup.
    metric: >
      Records with a recognised PULocationID divided by all sampled records.
    threshold: ">= 99%"
    exception_handling: >
      Handle documented special location codes explicitly. Do not classify
      a code as invalid solely because it is excluded from a subset of zones.

  - name: request_pickup_ordering
    description: >
      Pickup must not precede the recorded request time when both
      timestamps are available and interpretable.
    metric: >
      Records with valid request and pickup timestamps and pickup at or
      after request, divided by all sampled records.
    threshold: ">= 99%"
    handling: >
      Missing or unparsable required timestamps do not pass this check.
      Report missing timestamps separately from ordering violations.

  - name: responsiveness
    description: >
      Proportion of records with a valid request-to-pickup interval
      no greater than 10 minutes.
    metric: >
      Records with valid timestamps and a wait from 0 through 10 minutes,
      divided by all sampled records.
    threshold: ">= 95%"
    handling: >
      Negative waits and missing or unparsable timestamps do not pass.
      Report ordering violations and missing timestamps separately.

  - name: trip_duration_consistency
    description: >
      Reported trip_time should agree with elapsed time between pickup
      and drop-off timestamps within a documented tolerance.
    metric: >
      Proportion of records with valid timestamps and reported duration
      consistent with elapsed duration.
    threshold: ">= 99%"
    tolerance_seconds: 60
    notes: >
      The 60-second tolerance is a provisional consumer-defined rule and
      must be checked against source semantics before final reporting.

  - name: trip_duration_ordering
    description: >
      Drop-off must occur after pickup for records treated as completed trips.
    metric: >
      Proportion of sampled records with dropoff_datetime later than
      pickup_datetime.
    threshold: ">= 99%"
    handling: >
      Missing or unparsable timestamps do not pass. Report the count of
      non-positive elapsed durations separately.

  - name: trip_distance_validity
    description: >
      Trip distance must be positive for records included in ordinary
      trip-duration prediction.
    metric: >
      Proportion of sampled records with trip_miles greater than zero.
    threshold: ">= 99%"
    handling: >
      Flag non-positive values for review. Do not assume every flagged
      record is erroneous without examining its source context.

  - name: fare_review
    description: >
      Base passenger fare should be available and interpretable for
      fare-related use.
    metric: >
      Proportion of sampled records with a non-negative base passenger fare.
    threshold: ">= 99%"
    handling: >
      Negative fares are review flags pending source-semantic confirmation.
      They should not automatically be removed from the trip-duration study.

  - name: data_availability
    description: >
      Monthly source data should be released within the expected
      publication window.
    metric: >
      Time between the end of the trip month and public file release.
    threshold: "published within approximately 2 months of month end"
    testable_live: false

change_management:
  breaking_change_definition: >
    Renaming or removing a required field, changing its meaning or unit,
    changing location-code interpretation, or changing the source's
    publication process in a way that affects consumer expectations.

notification_expectation: >
  The consumer monitors publicly available source documentation and
  records any changes that affect the contract. No formal producer-consumer
  agreement is assumed.
